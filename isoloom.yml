# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# FixedASLR (Google's 2022 security competition, by Google; a pwn challenge) as an Isoloom spec:
# a scoreboard game behind a custom ELF loader that re-implements ASLR with its own random generator.
# The challenge folder 2022/quals/pwn-fixedaslr of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2022-fixedaslr

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.174.0/24, internet: false}

machines:
  challenge:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    volumes: {ctf: /chroot}     # the flag, written by ctf/flag.sh at every start
    ports:
      challenge:
        port: 1337
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the game greets the player with its main menu
    script: checks/probe.sh
    wait: 60

message: |
  FixedASLR (Google, 2022) answers at `nc localhost {{ machines.challenge.ports.challenge.published }}`.
  The loader picks every address itself: how random is its randomness, and what does the scoreboard leak?
